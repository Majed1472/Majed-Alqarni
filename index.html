<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>درع الوطن: حامي الحدود - اليوم الوطني السعودي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030a05;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #030a05, #0d2818);
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* HUD Overlay */
        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hud-box {
            background: rgba(3, 20, 10, 0.85);
            border: 1px solid #00ff88;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #00ff88;
            box-shadow: 0 0 10px rgba(0,255,136,0.3);
        }

        .hud-box span {
            color: #ffffff;
        }

        /* Ultimate Skill Button */
        #f15-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            background: linear-gradient(45deg, #111, #006c35);
            border: 2px solid #ffcc00;
            color: #ffcc00;
            font-weight: bold;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
            display: none;
            z-index: 15;
            transition: all 0.2s ease;
        }

        #f15-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        #f15-btn.ready {
            display: block;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 10px #ffcc00; }
            to { box-shadow: 0 0 25px #ffcc00, 0 0 5px #ffffff; }
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(4, 15, 8, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }

        .screen h1 {
            color: #00ff88;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,255,136,0.5);
        }

        .screen h2 {
            color: #ffcc00;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .screen p {
            color: #cccccc;
            margin-bottom: 25px;
            max-width: 500px;
            line-height: 1.6;
            font-size: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #00a859, #005a2f);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 168, 89, 0.4);
            transition: 0.2s;
            margin: 5px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #00c96b, #00733c);
            transform: translateY(-2px);
        }

        .btn-share {
            background: #1da1f2;
            box-shadow: 0 4px 15px rgba(29, 161, 242, 0.4);
        }

        .hidden { display: none !important; }

        .badge {
            width: 70px;
            height: 70px;
            background: #006c35;
            border: 2px solid #ffcc00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- HUD -->
    <div class="hud">
        <div class="hud-box">النقاط: <span id="score">0</span></div>
        <div class="hud-box">سلامة الحدود: <span id="health">100%</span></div>
        <div class="hud-box">الرتبة: <span id="rank">ملازم</span></div>
    </div>

    <!-- F15 Skill Button -->
    <button id="f15-btn" onclick="useF15()">🇸🇦 استدعاء F-15 (ضربة قاضية)</button>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <div class="badge">🇸🇦</div>
        <h1>درع الوطن: حامي الحدود</h1>
        <h2>بمناسبة اليوم الوطني السعودي</h2>
        <p>قم باعتراض الصواريخ والطائرات المسيرة المعادية قبل وصولها للحدود. اضغط على الشاشة لإطلاق صواريخ الدفاع الجوي.</p>
        <button class="btn" onclick="startGame()">ابدأ المهمة</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen hidden">
        <h1>انتهت المعركة</h1>
        <h2 id="final-rank">الرتبة: بطل الحدود</h2>
        <p>تم تحقيق نتيجة: <strong id="final-score" style="color: #00ff88;">0</strong> نقطة في الدفاع عن مقدسات الوطن.</p>
        <div>
            <button class="btn" onclick="startGame()">إعادة المحاولة</button>
            <button class="btn btn-share" onclick="shareResult()">مشاركة النتيجة 🚀</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    // Resize canvas
    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Audio Synthesizer (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'launch') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'explosion') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'f15') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(600, now + 0.8);
            osc.frequency.linearRampToValueAtTime(100, now + 1.5);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 1.5);
            osc.start(now);
            osc.stop(now + 1.5);
        }
    }

    // Game Variables
    let gameActive = false;
    let score = 0;
    let health = 100;
    let f15Charge = 0;
    let playerMissiles = [];
    let enemyMissiles = [];
    let explosions = [];
    let f15Strike = null;
    let spawnTimer = 0;

    // Ranks
    function getRank(s) {
        if (s < 100) return "ملازم";
        if (s < 300) return "نقيب";
        if (s < 600) return "رائد";
        if (s < 1000) return "عقيد";
        return "بطل المملكة 🇸🇦";
    }

    // Controls
    canvas.addEventListener('click', (e) => {
        if (!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        const targetX = e.clientX - rect.left;
        const targetY = e.clientY - rect.top;
        
        // Launch interceptor
        playerMissiles.push({
            startX: canvas.width / 2,
            startY: canvas.height - 20,
            x: canvas.width / 2,
            y: canvas.height - 20,
            targetX: targetX,
            targetY: targetY,
            speed: 8
        });
        playSound('launch');
    });

    function startGame() {
        score = 0;
        health = 100;
        f15Charge = 0;
        playerMissiles = [];
        enemyMissiles = [];
        explosions = [];
        f15Strike = null;
        gameActive = true;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('f15-btn').classList.remove('ready');

        updateHUD();
        requestAnimationFrame(gameLoop);
    }

    function updateHUD() {
        document.getElementById('score').innerText = score;
        document.getElementById('health').innerText = Math.max(0, health) + '%';
        document.getElementById('rank').innerText = getRank(score);

        if (f15Charge >= 5 && !f15Strike) {
            document.getElementById('f15-btn').classList.add('ready');
        } else {
            document.getElementById('f15-btn').classList.remove('ready');
        }
    }

    function useF15() {
        if (f15Charge < 5 || f15Strike) return;
        f15Charge = 0;
        document.getElementById('f15-btn').classList.remove('ready');
        playSound('f15');

        f15Strike = {
            x: -100,
            y: canvas.height * 0.3,
            speed: 15
        };
    }

    function spawnEnemy() {
        const startX = Math.random() * (canvas.width - 40) + 20;
        enemyMissiles.push({
            x: startX,
            y: 0,
            targetX: startX + (Math.random() * 100 - 50),
            targetY: canvas.height,
            speed: 1.5 + Math.random() * 1.5 + (score / 200)
        });
    }

    function endGame() {
        gameActive = false;
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-rank').innerText = "الرتبة الوطنية: " + getRank(score);
        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function shareResult() {
        const text = `حققت ${score} نقطة ورتبة (${getRank(score)}) في لعبة "درع الوطن" بمناسبة اليوم الوطني السعودي! 🇸🇦🛡️`;
        if (navigator.share) {
            navigator.share({ title: 'درع الوطن', text: text, url: window.location.href });
        } else {
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
        }
    }

    // Main Game Loop
    function gameLoop() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Ground / Border Base
        ctx.fillStyle = '#004d25';
        ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(canvas.width / 2 - 25, canvas.height - 25, 50, 10); // Battery Base

        // Enemy Spawning
        spawnTimer++;
        if (spawnTimer > Math.max(20, 80 - Math.floor(score / 20))) {
            spawnEnemy();
            spawnTimer = 0;
        }

        // Update & Draw Player Missiles
        for (let i = playerMissiles.length - 1; i >= 0; i--) {
            let m = playerMissiles[i];
            let dx = m.targetX - m.x;
            let dy = m.targetY - m.y;
            let dist = Math.hypot(dx, dy);

            if (dist < m.speed) {
                explosions.push({ x: m.targetX, y: m.targetY, radius: 2, maxRadius: 35, growing: true });
                playerMissiles.splice(i, 1);
                playSound('explosion');
            } else {
                m.x += (dx / dist) * m.speed;
                m.y += (dy / dist) * m.speed;

                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(m.startX, m.startY);
                ctx.lineTo(m.x, m.y);
                ctx.stroke();
            }
        }

        // Update & Draw Explosions
        for (let i = explosions.length - 1; i >= 0; i--) {
            let ex = explosions[i];
            if (ex.growing) {
                ex.radius += 2;
                if (ex.radius >= ex.maxRadius) ex.growing = false;
            } else {
                ex.radius -= 1;
                if (ex.radius <= 0) {
                    explosions.splice(i, 1);
                    continue;
                }
            }

            ctx.fillStyle = 'rgba(0, 255, 136, 0.4)';
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }

        // Update & Draw Enemies
        for (let i = enemyMissiles.length - 1; i >= 0; i--) {
            let em = enemyMissiles[i];
            em.y += em.speed;

            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(em.x, em.y - 10);
            ctx.lineTo(em.x, em.y);
            ctx.stroke();

            // Collision with Explosions
            let destroyed = false;
            for (let ex of explosions) {
                if (Math.hypot(em.x - ex.x, em.y - ex.y) < ex.radius) {
                    destroyed = true;
                    break;
                }
            }

            if (destroyed) {
                enemyMissiles.splice(i, 1);
                score += 10;
                f15Charge += 1;
                updateHUD();
                continue;
            }

            // Hit Border Ground
            if (em.y >= canvas.height - 20) {
                enemyMissiles.splice(i, 1);
                health -= 15;
                updateHUD();
                if (health <= 0) endGame();
            }
        }

        // F-15 Strike Effect
        if (f15Strike) {
            f15Strike.x += f15Strike.speed;

            // Jet Graphic
            ctx.fillStyle = '#cccccc';
            ctx.beginPath();
            ctx.moveTo(f15Strike.x, f15Strike.y);
            ctx.lineTo(f15Strike.x - 40, f15Strike.y - 15);
            ctx.lineTo(f15Strike.x - 40, f15Strike.y + 15);
            ctx.closePath();
            ctx.fill();

            // Green Smoke Trail
            ctx.strokeStyle = '#00a859';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(f15Strike.x - 40, f15Strike.y);
            ctx.lineTo(0, f15Strike.y);
            ctx.stroke();

            // Clear screen enemies
            for (let i = enemyMissiles.length - 1; i >= 0; i--) {
                explosions.push({ x: enemyMissiles[i].x, y: enemyMissiles[i].y, radius: 5, maxRadius: 30, growing: true });
                enemyMissiles.splice(i, 1);
                score += 10;
            }
            updateHUD();

            if (f15Strike.x > canvas.width + 100) {
                f15Strike = null;
            }
        }

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
